spring.application.name=MaheshPrint

server.port=${PORT:8080}

# QuickPrint storage
quickprint.storage.path=quickprint-storage

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# QuickPrint Admin Credentials
quickprint.admin.username=${ADMIN_USERNAME}
quickprint.admin.password=${ADMIN_PASSWORD}